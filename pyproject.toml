[project]
name = "pysweeper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "tkinter-mcp-server>=0.9.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["course/tests"]
