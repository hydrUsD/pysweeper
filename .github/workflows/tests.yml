name: Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # Lessons whose checks must pass (ids from course/tests/test_<id>.py).
      # Add a lesson once it is finished, e.g. "l0 l1 l2 l3 l4 l4_extra".
      LESSONS: l0 l1 l2 l3 l4 l4_extra l5 l5_extra l6 l7
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no moving major tag, so pin the release commit
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Tk checks (L8) need a display; xvfb-run provides a virtual one
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run lesson checks
        run: xvfb-run -a uv run pytest $(printf 'course/tests/test_%s.py ' $LESSONS)
