name: Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # Lessons whose checks must pass (ids from course/tests/test_<id>.py).
      # Add a lesson once it is finished, e.g. "l0 l1 l2 l3 l4 l4_extra".
      LESSONS: l0
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run lesson checks
        run: uv run pytest $(printf 'course/tests/test_%s.py ' $LESSONS)
